name = "reels-upload"
main = "src/index.js"
compatibility_date = "2024-12-01"

# Route via Cloudflare dashboard after deploy:
# upload.binteoapp.com/upload/* -> reels-upload

[vars]
# Public, non-secret vars
# BUNNY_STORAGE_HOST is public (region host). Override via secret if using non-default region.
BUNNY_STORAGE_HOST = "storage.bunnycdn.com"

# Secrets - MUST be set via `wrangler secret put` (never hardcode here):
# wrangler secret put BUNNY_STORAGE_ZONE
# wrangler secret put BUNNY_STORAGE_ACCESS_KEY
# wrangler secret put WORKER_SIGNING_SECRET
# Optional secret: BUNNY_STORAGE_HOST (for de.storage.bunnycdn.com etc.)
